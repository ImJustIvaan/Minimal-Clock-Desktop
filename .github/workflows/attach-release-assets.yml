name: Attach Build Artifacts to Release

# build-windows.yml (and the other build-*.yml workflows) only upload CI
# artifacts, never publish anything to a GitHub Release automatically -
# release assets have so far been attached by hand. This lets you pull a
# specific completed workflow run's artifacts and attach them to an
# existing release without doing it manually through the web UI, which is
# also what other automation (e.g. publish-choco.yml) downloads its
# installers from.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to pull artifacts from (e.g. a build-windows.yml run)'
        required: true
      tag:
        description: 'Release tag to attach the artifacts to (e.g. v1.0.1) - must already exist'
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts from the run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" artifacts/* --clobber -R "${{ github.repository }}"
