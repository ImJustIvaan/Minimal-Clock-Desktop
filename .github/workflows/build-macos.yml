name: Build macOS DMG

# Produces a Developer-ID-signed, notarized, stapled DMG ready for direct
# distribution outside the Mac App Store. Does nothing useful for signing
# until the required secrets below are set in the repo's Settings ->
# Secrets and variables -> Actions.
#
# Required secrets:
#   MACOS_CERTIFICATE_P12_BASE64  - Developer ID Application .p12 certificate
#   MACOS_CERTIFICATE_PASSWORD    - password used when exporting the .p12
#   MACOS_KEYCHAIN_PASSWORD       - any throwaway password for the temp CI keychain
#   APPLE_TEAM_ID                 - 10-char Apple Developer Team ID
#   APPLE_API_KEY_ID              - App Store Connect API key ID
#   APPLE_API_ISSUER_ID           - App Store Connect API issuer ID
#   APPLE_API_KEY_BASE64          - the AuthKey_<KEYID>.p8 file, base64-encoded
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS release (Universal)
        run: flutter build macos --release

      - name: Import signing certificate into a temporary keychain
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/developerid.p12"
          security import "$RUNNER_TEMP/developerid.p12" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Sign app with Developer ID and hardened runtime
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/Minimal Clock.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          fi
          codesign --force --deep --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "Developer ID Application: Amit Sondhi ($APPLE_TEAM_ID)" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/Minimal Clock.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          fi
          echo "Using app at: $APP_PATH"
          rm -f MinimalClock.dmg
          create-dmg \
            --volname "Minimal Clock" \
            --volicon "macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "$(basename "$APP_PATH")" 165 190 \
            --app-drop-link 495 190 \
            --hide-extension "$(basename "$APP_PATH")" \
            MinimalClock.dmg \
            "$APP_PATH" || true
          if [ ! -f "MinimalClock.dmg" ]; then
            echo "create-dmg failed, falling back to plain hdiutil DMG"
            mkdir -p dmg_root
            cp -R "$APP_PATH" dmg_root/
            ln -s /Applications dmg_root/Applications
            hdiutil create -volname "Minimal Clock" -srcfolder dmg_root -ov -format UDZO MinimalClock.dmg
          fi

      - name: Verify DMG exists
        run: |
          if [ ! -f "MinimalClock.dmg" ]; then
            echo "MinimalClock.dmg was not created!"
            exit 1
          fi
          echo "DMG size: $(stat -f%z MinimalClock.dmg) bytes"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun notarytool submit MinimalClock.dmg \
            --key "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

      - name: Staple notarization ticket
        run: xcrun stapler staple MinimalClock.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MinimalClock-macOS-DMG
          path: MinimalClock.dmg
