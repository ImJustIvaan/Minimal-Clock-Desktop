name: Deliver Mac App Store Build

# Waits for the most recently uploaded Mac App Store build (produced by
# build-macos-appstore.yml) to finish Apple's processing, and reports its
# processing state. Does NOT attach the build to a version or submit it
# for App Review — attaching/submitting needs an API key with the "App
# Manager" role, which this project's key doesn't have (it only has
# Developer, which is enough to upload and to check processing status).
# Once processing is done, attach the build to a version and submit for
# review manually in App Store Connect.
#
# Required secrets (same ones already used by build-macos-appstore.yml,
# plus one new one):
#   APPLE_API_KEY_ID          - App Store Connect API key ID
#   APPLE_API_ISSUER_ID       - App Store Connect API issuer ID
#   APPLE_API_KEY_BASE64      - the AuthKey_<KEYID>.p8 file, base64-encoded
#   APP_STORE_CONNECT_APP_ID  - the app's numeric App Store Connect ID (the
#                               "Apple ID" shown on the app's App Information
#                               page in App Store Connect — NOT the bundle ID)

on:
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyjwt cryptography requests

      - name: Wait for build processing
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
        run: python3 .github/scripts/deliver_macos_appstore.py
